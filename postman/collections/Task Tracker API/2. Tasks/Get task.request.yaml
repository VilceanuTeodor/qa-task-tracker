$kind: http-request
url: "{{baseUrl}}/api/tasks/{{taskId}}"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));

      const task = pm.response.json();
      pm.test("Correct task returned", () => pm.expect(task.id).to.eql(Number(pm.collectionVariables.get("taskId"))));
      pm.test("Has all task fields plus comments and history", () => pm.expect(task).to.have.all.keys(
          "id", "title", "description", "status", "creator", "assignee", "created_at", "updated_at", "comments", "history"));
    language: text/javascript
order: 6000
