$kind: http-request
url: "{{baseUrl}}/api/tasks?assignee={{username}}"
method: GET
queryParams:
  assignee: "{{username}}"
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));

      const tasks = pm.response.json();
      const me = pm.collectionVariables.get("username");
      pm.test("Every task is assigned to the user", () => tasks.forEach(t => pm.expect(t.assignee).to.include(me)));
      pm.test("At least one result", () => pm.expect(tasks.length).to.be.above(0));
    language: text/javascript
order: 5000
