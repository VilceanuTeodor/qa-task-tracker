$kind: http-request
url: "{{baseUrl}}/api/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));

      const users = pm.response.json();
      pm.test("New user is in the list", () => pm.expect(users.map(u => u.username)).to.include(pm.collectionVariables.get("username")));
      pm.test("Regular users don't see roles", () => pm.expect(users[0]).to.not.have.property("role"));
    language: text/javascript
order: 1000
