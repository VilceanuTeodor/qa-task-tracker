$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));

      const tasks = pm.response.json();
      pm.test("Returns an array", () => pm.expect(tasks).to.be.an("array"));
      pm.test("Contains the new task", () => pm.expect(tasks.map(t => t.id)).to.include(Number(pm.collectionVariables.get("taskId"))));
      pm.test("Newest first", () => {
          const ids = tasks.map(t => t.id);
          pm.expect(ids).to.eql([...ids].sort((a, b) => b - a));
      });
    language: text/javascript
order: 3000
