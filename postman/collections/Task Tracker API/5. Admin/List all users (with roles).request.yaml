$kind: http-request
url: "{{baseUrl}}/api/admin/users"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));

      const users = pm.response.json();
      const created = users.find(u => u.id === Number(pm.collectionVariables.get("userId")));
      pm.test("New user is listed as a regular user", () => pm.expect(created.role).to.eql("user"));
      pm.test("No password hashes", () => users.forEach(u => pm.expect(u).to.not.have.property("password_hash")));
    language: text/javascript
order: 2000
