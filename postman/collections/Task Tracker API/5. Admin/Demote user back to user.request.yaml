$kind: http-request
url: "{{baseUrl}}/api/admin/users/{{userId}}"
method: PATCH
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "role": "user"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));
      pm.test("Role is user again", () => pm.expect(pm.response.json().role).to.eql("user"));
    language: text/javascript
order: 4000
