$kind: http-request
description: Whitespace-only comments are rejected.
url: "{{baseUrl}}/api/tasks/{{taskId}}/comments"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "body": "   "
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422 Unprocessable", () => pm.response.to.have.status(422));
      pm.test("Error message mentions \"Comment is required\"", () => pm.expect(pm.response.json().detail).to.include("Comment is required"));
    language: text/javascript
order: 3000
