$kind: http-request
url: "{{baseUrl}}/api/auth/signup"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "qa_short_{{$timestamp}}",
      "password": "short"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422 Unprocessable", () => pm.response.to.have.status(422));
      pm.test("Error message mentions \"at least 8\"", () => pm.expect(pm.response.json().detail).to.include("at least 8"));
    language: text/javascript
order: 3000
