$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "definitely-wrong"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 401 Unauthorized", () => pm.response.to.have.status(401));
      pm.test("Error message mentions \"Invalid username or password\"", () => pm.expect(pm.response.json().detail).to.include("Invalid username or password"));
    language: text/javascript
order: 5000
