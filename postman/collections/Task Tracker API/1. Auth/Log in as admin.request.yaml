$kind: http-request
description: Uses adminUsername/adminPassword from the environment. Saves the token as {{adminToken}}.
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "username": "{{adminUsername}}",
      "password": "{{adminPassword}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 200 OK", () => pm.response.to.have.status(200));

      const res = pm.response.json();
      pm.test("Account has the admin role", () => pm.expect(res.user.role).to.eql("admin"));
      pm.collectionVariables.set("adminToken", res.access_token);
      pm.collectionVariables.set("adminId", res.user.id);
    language: text/javascript
order: 7000
