$kind: http-request
url: "{{baseUrl}}/api/tasks/999999"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 404 Not Found", () => pm.response.to.have.status(404));
      pm.test("Error message mentions \"not found\"", () => pm.expect(pm.response.json().detail).to.include("not found"));
    language: text/javascript
order: 8000
