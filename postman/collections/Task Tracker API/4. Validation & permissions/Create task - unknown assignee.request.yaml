$kind: http-request
url: "{{baseUrl}}/api/tasks"
method: POST
headers:
  Content-Type: application/json
body:
  type: json
  content: |-
    {
      "title": "Ghost assignee",
      "assignee": "no_such_user_123"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 422 Unprocessable", () => pm.response.to.have.status(422));
      pm.test("Error message mentions \"not a registered user\"", () => pm.expect(pm.response.json().detail).to.include("not a registered user"));
    language: text/javascript
order: 7000
