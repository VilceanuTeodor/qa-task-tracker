$kind: http-request
description: Only admins can delete tasks.
url: "{{baseUrl}}/api/tasks/{{taskId}}"
method: DELETE
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status is 403 Forbidden", () => pm.response.to.have.status(403));
      pm.test("Error message mentions \"Admin access required\"", () => pm.expect(pm.response.json().detail).to.include("Admin access required"));
    language: text/javascript
order: 10000
