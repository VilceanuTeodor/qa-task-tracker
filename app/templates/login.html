{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<div class="auth-box">
  <h1>Sign in</h1>
  {% if error %}<p class="error" data-testid="login-error">{{ error }}</p>{% endif %}
  <form method="post" action="/login" class="card form" data-testid="login-form">
    <input type="hidden" name="next" value="{{ next }}">
    <label>Username
      <input name="username" value="{{ form.username or '' }}" required autocomplete="username" autofocus data-testid="input-username">
    </label>
    <label>Password
      <input name="password" type="password" required autocomplete="current-password" data-testid="input-password">
    </label>
    <button class="button" data-testid="submit-login">Sign in</button>
  </form>
  <p class="muted">No account? <a href="/signup" data-testid="link-signup">Sign up</a></p>
</div>
{% endblock %}
