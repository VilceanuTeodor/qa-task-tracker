# Runs the automated tests on GitHub's servers.
# Triggered on every push to main, on every pull request, and by the
# "Run workflow" button in the repo's Actions tab.
name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    name: API and UI tests (pytest + Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Download the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the app and test tools
        run: pip install -r requirements-dev.txt

      - name: Install the Chromium browser for the UI tests
        run: python -m playwright install --with-deps chromium

      - name: Run the tests (headless, so no pauses)
        run: python -m pytest -v --screenshot only-on-failure --tracing retain-on-failure

      - name: Save screenshots and traces of failed UI tests
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failures
          path: test-results/
          if-no-files-found: ignore

  postman:
    name: Postman collection (Newman)
    runs-on: ubuntu-latest
    env:
      # A throwaway admin password for the temporary app below; not a real secret.
      ADMIN_PASSWORD: ci-admin-password
      TRACKER_DB: ci.db
    steps:
      - name: Download the code
        uses: actions/checkout@v5

      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install the app
        run: pip install -r requirements.txt

      - name: Start the app in the background
        run: |
          python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/login > /dev/null && exit 0
            sleep 1
          done
          echo "The app did not start:"; cat app.log; exit 1

      - name: Run the Postman collection
        run: >
          npx --yes newman run postman/task-tracker.postman_collection.json
          -e postman/local.postman_environment.json
          --env-var adminPassword="$ADMIN_PASSWORD"
